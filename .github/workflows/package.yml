# Builds this repo's conda package with the shared nandi-conda workflow and,
# on pushes to main, publishes it to prefix.dev/nandi-testing, plus an
# android-aarch64 cross build.
# All the logic lives in https://github.com/nandi-conda/ci.
name: Package

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    uses: nandi-conda/ci/.github/workflows/conda-package.yml@main
    with:
      target-platforms: android-aarch64
    secrets: inherit
    permissions:
      contents: read
      id-token: write
